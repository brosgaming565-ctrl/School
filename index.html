<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Salary Receipt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f4f4f9;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #333;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .header img {
      width: 100px;
      height: auto;
    }
    .header-text {
      text-align: center;
      flex-grow: 1;
    }
    .header-text h1 {
      font-size: 20px;
      color: #000;
      text-transform: uppercase;
    }
    .header-text p {
      font-size: 13px;
      color: #444;
      margin-top: 3px;
    }
    .title {
      text-align: center;
      margin-bottom: 20px;
      font-size: 16px;
      text-decoration: underline;
      font-weight: bold;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full {
      grid-column: span 2;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #333;
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .signatures {
      display: flex;
      justify-content: space-between;
      margin-top: 50px;
      padding-top: 10px;
    }
    .sig-box {
      text-align: center;
      width: 200px;
    }
    .sig-line {
      border-top: 1px solid #000;
      margin-top: 40px;
      padding-top: 5px;
      font-size: 13px;
      font-weight: bold;
    }
    .btn-container {
      text-align: center;
      margin-top: 25px;
    }
    .btn-print {
      background: #28a745;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    @media print {
      .btn-container { display: none; }
      body { background: white; padding: 0; }
      .container { box-shadow: none; border: none; }
      input { border: none; border-bottom: 1px dotted #000; border-radius: 0; padding: 2px; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header with Logo -->
  <div class="header">
    <img src="https://i.ibb.co/6R2s89y/logo.jpg" alt="School Logo" id="schoolLogo">
    <div class="header-text">
      <h1>Shree Chiranjivee Narayani Residential School</h1>
      <p>Yamunamai, R.M.-1, Sukdev Chowk, Rautahat</p>
      <p>Estd: 2073</p>
    </div>
  </div>

  <div class="title">TEACHER SALARY RECEIPT</div>

  <!-- Details Form -->
  <div class="form-grid">
    <div class="form-group">
      <label>Receipt No:</label>
      <input type="text" placeholder="Receipt Number">
    </div>
    <div class="form-group">
      <label>Date:</label>
      <input type="date">
    </div>

    <div class="form-group">
      <label>Teacher's Name:</label>
      <input type="text" placeholder="Enter Teacher Name">
    </div>
    <div class="form-group">
      <label>Father's Name:</label>
      <input type="text" placeholder="Enter Father's Name">
    </div>

    <div class="form-group">
      <label>Contact No:</label>
      <input type="text" placeholder="Enter Phone Number">
    </div>
    <div class="form-group">
      <label>Designation/Subject:</label>
      <input type="text" placeholder="e.g. Science Teacher">
    </div>

    <div class="form-group">
      <label>Basic Salary (NPR):</label>
      <input type="number" id="basicSalary" oninput="calculateNet()" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>Deduction Amount (NPR):</label>
      <input type="number" id="deduction" oninput="calculateNet()" placeholder="0.00">
    </div>

    <div class="form-group">
      <label>Net Paid Amount (NPR):</label>
      <input type="number" id="netAmount" readonly placeholder="0.00">
    </div>
    <div class="form-group">
      <label>Month / Year:</label>
      <input type="text" placeholder="e.g. Baishakh 2081">
    </div>

    <div class="form-group full">
      <label>Amount in Words (Manual):</label>
      <input type="text" placeholder="e.g. Twenty Thousand Five Hundred Rupees Only">
    </div>
  </div>

  <!-- Signatures -->
  <div class="signatures">
    <div class="sig-box">
      <div class="form-group" style="margin-bottom: 5px;">
        <label>Prepared By (Name):</label>
        <input type="text" placeholder="Staff Name" style="text-align: center;">
      </div>
      <div style="font-size: 12px; color: #555;">(Bill Prepared By)</div>
    </div>

    <div class="sig-box">
      <div class="sig-line">Authorized Signature</div>
    </div>
  </div>

  <div class="btn-container">
    <button class="btn-print" onclick="window.print()">Print Receipt</button>
  </div>
</div>

<script>
  function calculateNet() {
    const basic = parseFloat(document.getElementById('basicSalary').value) || 0;
    const deduction = parseFloat(document.getElementById('deduction').value) || 0;
    const net = basic - deduction;
    document.getElementById('netAmount').value = net > 0 ? net.toFixed(2) : '0.00';
  }
</script>

</body>
</html>
